; Fieldset Grundlagen - Schnellstart
PLG_CONTENT_SNAP_GALLERY_QUICKSTART_LABEL="Schnellstart-Anleitung"
PLG_CONTENT_SNAP_GALLERY_WITHEDITORBUTTON_LABEL="Mit Editor-Button-Erweiterung:"
PLG_CONTENT_SNAP_GALLERY_WITHEDITORBUTTON_DESC="1. Klicken Sie auf die Schaltfl&auml;che &quot;Snap Gallery&quot; im Artikeleditor. 2. W&auml;hlen Sie Ihre Optionen. 3. Klicken Sie auf &quot;Einf&uuml;gen&quot;. Das war's!"
PLG_CONTENT_SNAP_GALLERY_WITHOUTEDITORBUTTON_LABEL="Manuelle Methode:"
PLG_CONTENT_SNAP_GALLERY_WITHOUTEDITORBUTTON_DESC="Wenn Sie den Editor-Button nicht verwenden m&ouml;chten, k&ouml;nnen Sie Galerien zu Ihren Artikeln hinzuf&uuml;gen, indem Sie einfach den Text &quot;{gallery}meinordner{/gallery}&quot; ohne Anf&uuml;hrungszeichen an beliebiger Stelle in Ihrem Artikel einf&uuml;gen. Standardm&auml;&szlig;ig werden Bilder aus dem Ordner &quot;ihrejoomlasite.com/images/meinordner&quot; eingebunden."
PLG_CONTENT_SNAP_GALLERY_MOREINSTRUCTIONS_LABEL="Weitere Informationen"
PLG_CONTENT_SNAP_GALLERY_MOREINSTRUCTIONS_DESC="Die vollst&auml;ndige Dokumentation ist verf&uuml;gbar unter <a href=\"https://github.com/dious38/rc-gallery\" target=\"_blank\">https://github.com/dious38/rc-gallery</a>"

; Fieldset Galerie
PLG_CONTENT_SNAP_GALLERY_GALLERYDESCRIPTION_LABEL="Galerie"
PLG_CONTENT_SNAP_GALLERY_GALLERYFOLDER_LABEL="Stammverzeichnis f&uuml;r Bilder"
PLG_CONTENT_SNAP_GALLERY_GALLERYFOLDER_DESC="W&auml;hlen Sie den &uuml;bergeordneten Ordner, der die Ordner enth&auml;lt, die Sie f&uuml;r Ihre Galerien verwenden m&ouml;chten."
PLG_CONTENT_SNAP_GALLERY_LAYOUT_LABEL="Layout"
PLG_CONTENT_SNAP_GALLERY_LAYOUT_DESC="W&auml;hlen Sie das Galerie-Layout. Kann pro Galerie mit layout=&quot;square_grid&quot; &uuml;berschrieben werden"
PLG_CONTENT_SNAP_GALLERY_LAYOUT_OPT_JUSTIFIED="Blo&ouml;cksatz (Standard)"
PLG_CONTENT_SNAP_GALLERY_LAYOUT_OPT_SQUARE_GRID="Quadratisches Raster"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_LABEL="Bilder sortieren nach"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_DESC="Bilder nach Dateiname oder Datum sortieren. Beachten Sie, dass die Sortierung nach Datum erfordert, dass das Bild ein Datum in den EXIF-Daten hat."
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_OPT_FILENAME="Dateiname"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_OPT_DATE="Datum"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_OPT_RANDOM="Zuf&auml;llig (bei jedem Seitenaufruf anders)"
PLG_CONTENT_SNAP_GALLERY_SORTDESC_LABEL="Sortierrichtung"
PLG_CONTENT_SNAP_GALLERY_SORTDESC_DESC="Bilder in aufsteigender oder absteigender Reihenfolge sortieren."
PLG_CONTENT_SNAP_GALLERY_SORTDESC_OPT_ASCENDING="Aufsteigend"
PLG_CONTENT_SNAP_GALLERY_SORTDESC_OPT_DESCENDING="Absteigend"
PLG_CONTENT_SNAP_GALLERY_MINROWHEIGHT_LABEL="Ziel-Zeilenh&ouml;he"
PLG_CONTENT_SNAP_GALLERY_MINROWHEIGHT_DESC="Die Zeilenh&ouml;he variiert je nach Form der enthaltenen Bilder, wird aber versuchen, dem hier eingegebenen Wert nahe zu kommen."
PLG_CONTENT_SNAP_GALLERY_THUMBQUALITY_LABEL="Miniaturbildqualit&auml;t (0 - 100)"
PLG_CONTENT_SNAP_GALLERY_THUMBQUALITY_DESC="Bildqualit&auml;t f&uuml;r Miniaturbilder. 100 ergibt die h&ouml;chstm&ouml;gliche Qualit&auml;t, aber eine gr&ouml;&szlig;ere Dateigr&ouml;&szlig;e. Verringern Sie diesen Wert, um die Dateigr&ouml;&szlig;e der Miniaturbilder zu reduzieren. Beachten Sie, dass Sie Miniaturbilder neu erstellen lassen k&ouml;nnen, indem Sie sie &uuml;ber Ihren FTP-Client oder den Joomla-Medienmanager l&ouml;schen. Weitere Informationen finden Sie im Snap Gallery Benutzerhandbuch auf therichcourt.com."
PLG_CONTENT_SNAP_GALLERY_IMAGEMARGIN_LABEL="Bildabstand"
PLG_CONTENT_SNAP_GALLERY_IMAGEMARGIN_DESC="Gr&ouml;&szlig;e der Bildabst&auml;nde in Pixel."
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_LABEL="Bildtitel"
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_DESC="Zeigt den Dateinamen des Bildes &uuml;ber dem Bild an. Beachten Sie, dass die Dateierweiterung nicht angezeigt wird, Unterstriche durch Leerzeichen ersetzt werden und der erste Buchstabe gro&szlig;geschrieben wird."
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_OPT_HIDE="Bildtitel nicht anzeigen"
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_OPT_HOVER="Bildtitel nur beim Hover anzeigen"
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_OPT_ALWAYS="Bildtitel immer anzeigen"
PLG_CONTENT_SNAP_GALLERY_USETITLEASALT_LABEL="Bildtitel als 'alt'-Attribut verwenden"
PLG_CONTENT_SNAP_GALLERY_USETITLEASALT_DESC="Verwendet den Bildtitel als 'alt'-Attribut f&uuml;r das Miniaturbild. Dies ist n&uuml;tzlich, wenn Ihre Bilder beschreibende Titel haben, aber wenn es nur etwas wie 'DSC00023.JPG' ist, ist es weniger n&uuml;tzlich und Sie m&ouml;chten dies vielleicht deaktivieren. Sie k&ouml;nnen Ihre Bildtitel &uuml;berschreiben, wenn Ihre Dateinamen nicht beschreibend sind. Weitere Details finden Sie im Handbuch. Insgesamt ist diese Funktion gut f&uuml;r SEO und Barrierefreiheit, aber nur wenn Sie gute Bildtitel haben."
PLG_CONTENT_SNAP_GALLERY_USELABELSFILE_LABEL="Titel aus Labels-Datei laden"
PLG_CONTENT_SNAP_GALLERY_USELABELSFILE_DESC="Erweiterte Funktion - siehe Benutzerhandbuch auf <a href=\"https://therichcourt.com\" target=\"_blank\">www.TheRichCourt.com</a>"

; Fieldset Shadowbox
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXDESCRIPTION_LABEL="Shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXDESCRIPTION_DESC="W&auml;hlen Sie den Shadowbox-Typ aus. Wenn Sie bereits eine eigene Shadowbox haben, k&ouml;nnen Sie diese verwenden, indem Sie 'Andere Shadowbox verwenden' ausw&auml;hlen. Dies f&uuml;gt rel='shadowbox[snap_gallery]'-Links zu den Bildern hinzu, bindet aber nicht die Shadowbox dieses Plugins ein, sodass Ihre eigene Shadowbox &uuml;bernimmt. Diese Option ist n&uuml;tzlich, um Konflikte mit Ihrem bestehenden Shadowbox-Plugin zu vermeiden."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_LABEL="Shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_DESC="W&auml;hlen Sie den Shadowbox-Typ f&uuml;r die Galerie."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_BUILTIN="Integrierte Shadowbox verwenden (Empfohlen)"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_LEGACY="&Auml;ltere Shadowbox verwenden"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_ANOTHER="Andere Shadowbox verwenden"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_NONE="Keine Shadowbox"
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_LABEL="Scrollen verhindern"
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_DESC="Sie m&ouml;chten vielleicht das Scrollen der Seite verhindern, w&auml;hrend die Shadowbox ge&ouml;ffnet ist. Dies blendet die Scrollleiste aus, was in einigen Browsern dazu f&uuml;hrt, dass der Inhalt etwas breiter wird und sich nach links und rechts zu verschieben scheint."
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_OPT_ALLOW="Scrollen erlauben"
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_OPT_PREVENT="Scrollen verhindern (blendet die Scrollleiste aus, was zu Inhaltsverschiebungen f&uuml;hren kann)"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXANIMATIONS_LABEL="&Uuml;bergangsanimationen"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXANIMATIONS_DESC="W&auml;hlen Sie die Art der &Uuml;bergangsanimation beim Wechseln zwischen Bildern in der Shadowbox (gilt nicht f&uuml;r die &auml;ltere Shadowbox)"

; Fieldset Darstellung - Galerie-Miniaturbilder
PLG_CONTENT_SNAP_GALLERY_THUMBNAILS_NOTE_LABEL="Galerie-Miniaturbilder"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILS_NOTE_DESC="Passen Sie einige Einstellungen an Ihre Website an."
PLG_CONTENT_SNAP_GALLERY_THUMBBGCOLOUR_LABEL="Hintergrundfarbe der Miniaturbilder"
PLG_CONTENT_SNAP_GALLERY_THUMBBGCOLOUR_DESC="Die Farbe der Bildminiaturansichten w&auml;hrend die Bilder geladen werden."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTCOLOUR_LABEL="Bildtitelfarbe"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTCOLOUR_DESC="Die Farbe der Bildtitel (beachten Sie, dass die Bildtitel in den Galerieeinstellungen aktiviert sein m&uuml;ssen, damit dies wirksam wird)."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTSIZE_LABEL="Titeltext-Gr&ouml;&szlig;e (px)"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTSIZE_DESC="Legen Sie die Gr&ouml;&szlig;e des Titeltextes &uuml;ber den Miniaturbildern fest. Standardm&auml;&szlig;ig 14px."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_LABEL="Titeltext-Schriftst&auml;rke"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_DESC="Schriftst&auml;rke des Titeltextes in den Miniaturbildern."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_OPT_BOLD="Fett"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_OPT_NORMAL="Normal"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTALIGN_LABEL="Titeltext-Ausrichtung"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTALIGN_DESC="Richten Sie den Titeltext innerhalb des Miniaturbilds aus. Beachten Sie, dass bei &Uuml;berlauf auf versteckt und dieser Einstellung auf zentriert, der Text linksb&uuml;ndig erscheint, wenn er breiter als das Miniaturbild ist."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_LABEL="Titeltext-&Uuml;berlauf"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_DESC="Was tun, wenn der Titeltext breiter als das Miniaturbild ist."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_OPT_HIDDEN="Versteckt"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_OPT_AUTO="Automatisch"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILRADIUS_LABEL="Eckenradius der Miniaturbilder (px)"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILRADIUS_DESC="Runden Sie die Ecken der Miniaturbilder ab. 3px eignet sich hervorragend f&uuml;r einen sauberen, modernen Look. Oder verwenden Sie einen gro&szlig;en Radius f&uuml;r blasen&auml;hnliche Miniaturbilder. Geben Sie 0 f&uuml;r normale eckige Ecken ein."
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_LABEL="Miniaturbildfilter"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_DESC="Wenden Sie einen Filter auf die Miniaturbilder in Ihrer Galerie an. Dieser Filter wird mit einem sanften &Uuml;bergang entfernt, wenn die Maus &uuml;ber das Miniaturbild bewegt wird, und zeigt die wahren Farben. Beachten Sie, dass der Miniaturbildfilter nur in modernen Browsern funktioniert (nicht im Internet Explorer). IE-Benutzer sehen die Bilder in voller Farbe."
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_OPT_NONE="Kein Filter"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_OPT_SEPIA="Sepia"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_OPT_GREYSCALE="Graustufen (Schwarz-Wei&szlig;)"

; Fieldset Darstellung - Shadowbox
PLG_CONTENT_SNAP_GALLERY_SHADOWBOX_APPEARANCE_NOTE_LABEL="Shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOX_APPEARANCE_NOTE_DESC="Die folgenden Einstellungen gelten nur, wenn Sie die integrierte Shadowbox verwenden (standardm&auml;&szlig;ig aktiviert)."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_LABEL="Bildtitel"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_DESC="Bildtitel in der Shadowbox anzeigen oder ausblenden. 'Automatisch ausblenden' l&auml;sst den Titel bei Mausbewegung erscheinen und blendet ihn bei Inaktivit&auml;t wieder aus."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_OPT_SHOW="Anzeigen"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_OPT_HIDE="Ausblenden"
PLG_CONTENT_SNAP_GALLERY_OVERLAYCOLOUR_LABEL="Overlay-Farbe"
PLG_CONTENT_SNAP_GALLERY_OVERLAYCOLOUR_DESC="Die Farbe, die den Rest der Website abdeckt, wenn die Shadowbox ge&ouml;ffnet wird. Beachten Sie, dass diese Farbe durch die Deckkraft-Einstellung beeinflusst wird."
PLG_CONTENT_SNAP_GALLERY_OVERLAYOPACITY_LABEL="Overlay-Deckkraft"
PLG_CONTENT_SNAP_GALLERY_OVERLAYOPACITY_DESC="Die Deckkraft der Farbe, die den Rest der Website abdeckt, wenn die Shadowbox ge&ouml;ffnet wird."
PLG_CONTENT_SNAP_GALLERY_OVERLAYBLUR_LABEL="Overlay-Unsch&auml;rferadius (px)"
PLG_CONTENT_SNAP_GALLERY_OVERLAYBLUR_DESC="Der backdrop-filter Unsch&auml;rferadius in Pixel. Beachten Sie, dass diese Funktion nicht in allen Browsern unterst&uuml;tzt wird, sodass Sie m&ouml;glicherweise in einigen Browsern keine Unsch&auml;rfe sehen."

; Fieldset &Uuml;ber
PLG_CONTENT_SNAP_GALLERY_ABOUT_LABEL="Snap Gallery"
PLG_CONTENT_SNAP_GALLERY_ABOUT_DESC="Ein responsives Bildergalerie-Plugin f&uuml;r Joomla 5/6. Zeigt sch&ouml;ne randlose Galerien in Ihren Artikeln &uuml;ber einfache {gallery}-Tags an."
PLG_CONTENT_SNAP_GALLERY_DOCUMENTATION_LABEL="Dokumentation"
PLG_CONTENT_SNAP_GALLERY_DOCUMENTATION_DESC="Vollst&auml;ndige Dokumentation und Quellcode verf&uuml;gbar unter <a href=\"https://github.com/dious38/rc-gallery\" target=\"_blank\">https://github.com/dious38/rc-gallery</a>"
PLG_CONTENT_SNAP_GALLERY_SUPPORT_LABEL="Support"
PLG_CONTENT_SNAP_GALLERY_SUPPORT_DESC="F&uuml;r Fehlerberichte und Funktionsw&uuml;nsche besuchen Sie bitte <a href=\"https://github.com/dious38/rc-gallery/issues\" target=\"_blank\">https://github.com/dious38/rc-gallery/issues</a>"
PLG_CONTENT_SNAP_GALLERY_CREDITS_LABEL="Credits"
PLG_CONTENT_SNAP_GALLERY_CREDITS_DESC="Snap Gallery basiert auf RC Gallery, urspr&uuml;nglich erstellt von Rich Court (<a href=\"https://github.com/TheRichCourt/rc-gallery\" target=\"_blank\">https://github.com/TheRichCourt/rc-gallery</a>). Lizenz GPL-2.0."

; Fieldset Erweitert
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE_LABEL="Erweiterte Funktion"
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE_DESC="Wenn Sie gro&szlig;e Galerien verwenden, kann die Erstellung aller Miniaturbilder sehr lange dauern. Dies geschieht nur beim ersten Besuch einer Seite, ist aber trotzdem nicht ideal. Wenn Sie gen&uuml;gend Bilder haben, wird die HTTP-Anfrage ablaufen, w&auml;hrend Ihr Server noch die Miniaturbilder erstellt. Das Ergebnis ist, dass der Besucher einen Fehler sieht. Sie k&ouml;nnen dies auf zwei verschiedene Arten umgehen."
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE1_LABEL="1"
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE1_DESC="1. Laden Sie die Seite einige Male neu - jedes Mal macht es etwas mehr Fortschritt, und nach einigen Versuchen wird die Seite immer korrekt angezeigt."
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE2_LABEL="2"
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE2_DESC="2. Aktivieren Sie diese Einstellung. Es gibt hier jedoch auch ein m&ouml;gliches Problem. Diese Einstellung sendet eine AJAX-Anfrage f&uuml;r jedes Bild, um die Miniaturbilder asynchron zu erstellen. Einige Server betrachten diese gro&szlig;e Anzahl &auml;hnlicher Anfragen jedoch als m&ouml;glichen Angriff und blockieren sie. Aktivieren Sie diese Option also auf eigenes Risiko! Wenn es auf Ihrem Server funktioniert, ist es definitiv die bessere Option."
PLG_CONTENT_SNAP_GALLERY_AJAXIMAGES_LABEL="AJAX-Bilder aktivieren"
PLG_CONTENT_SNAP_GALLERY_AJAXIMAGES_DESC="Siehe Hinweis oben"

