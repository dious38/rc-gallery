; Fieldset basic - Démarrage rapide
PLG_CONTENT_SNAP_GALLERY_QUICKSTART_LABEL="Instructions de démarrage rapide"
PLG_CONTENT_SNAP_GALLERY_WITHEDITORBUTTON_LABEL="Avec le module bouton éditeur :"
PLG_CONTENT_SNAP_GALLERY_WITHEDITORBUTTON_DESC="1. Cliquez sur le bouton 'Snap Gallery' dans l'éditeur d'article. 2. Sélectionnez vos options. 3. Cliquez sur 'insérer'. C'est tout !"
PLG_CONTENT_SNAP_GALLERY_WITHOUTEDITORBUTTON_LABEL="Méthode manuelle :"
PLG_CONTENT_SNAP_GALLERY_WITHOUTEDITORBUTTON_DESC="Si vous préférez ne pas utiliser le bouton éditeur, vous pouvez ajouter des galeries à vos articles en incluant simplement le texte '{gallery}mondossier{/gallery}', sans les guillemets, n'importe où dans votre article. Par défaut, cela inclura les images du dossier 'votresitejoomla.com/images/mondossier'."
PLG_CONTENT_SNAP_GALLERY_MOREINSTRUCTIONS_LABEL="Plus d'informations"
PLG_CONTENT_SNAP_GALLERY_MOREINSTRUCTIONS_DESC="La documentation complète est disponible sur <a href=\"https://github.com/dious38/rc-gallery\" target=\"_blank\">https://github.com/dious38/rc-gallery</a>"

; Fieldset Galerie
PLG_CONTENT_SNAP_GALLERY_GALLERYDESCRIPTION_LABEL="Galerie"
PLG_CONTENT_SNAP_GALLERY_GALLERYFOLDER_LABEL="Dossier racine des images"
PLG_CONTENT_SNAP_GALLERY_GALLERYFOLDER_DESC="Choisissez le dossier parent contenant les dossiers que vous souhaitez utiliser pour vos galeries."
PLG_CONTENT_SNAP_GALLERY_LAYOUT_LABEL="Mise en page"
PLG_CONTENT_SNAP_GALLERY_LAYOUT_DESC="Choisissez la mise en page de la galerie. Peut être surchargé par galerie avec layout='square_grid'"
PLG_CONTENT_SNAP_GALLERY_LAYOUT_OPT_JUSTIFIED="Justifié (par défaut)"
PLG_CONTENT_SNAP_GALLERY_LAYOUT_OPT_SQUARE_GRID="Grille carrée"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_LABEL="Trier les images par"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_DESC="Trier les images par nom de fichier ou par date. Notez que le tri par date nécessite que l'image contienne une date dans ses données EXIF."
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_OPT_FILENAME="Nom de fichier"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_OPT_DATE="Date"
PLG_CONTENT_SNAP_GALLERY_SORTTYPE_OPT_RANDOM="Aléatoire (différent à chaque chargement de la page)"
PLG_CONTENT_SNAP_GALLERY_SORTDESC_LABEL="Ordre de tri"
PLG_CONTENT_SNAP_GALLERY_SORTDESC_DESC="Trier les images par ordre croissant ou décroissant."
PLG_CONTENT_SNAP_GALLERY_SORTDESC_OPT_ASCENDING="Croissant"
PLG_CONTENT_SNAP_GALLERY_SORTDESC_OPT_DESCENDING="Décroissant"
PLG_CONTENT_SNAP_GALLERY_MINROWHEIGHT_LABEL="Hauteur cible des rangées"
PLG_CONTENT_SNAP_GALLERY_MINROWHEIGHT_DESC="La hauteur des rangées varie en fonction de la forme des images incluses, mais visera à se rapprocher du nombre saisi ici."
PLG_CONTENT_SNAP_GALLERY_THUMBQUALITY_LABEL="Qualité des miniatures (0 - 100)"
PLG_CONTENT_SNAP_GALLERY_THUMBQUALITY_DESC="Qualité d'image pour les miniatures. 100 donne la qualité maximale possible, mais une taille de fichier plus élevée. Diminuez cette valeur pour réduire la taille des fichiers miniatures. Notez que vous pouvez recréer les miniatures en les supprimant via votre client FTP ou le gestionnaire de médias Joomla. Consultez le guide utilisateur Snap Gallery, disponible sur therichcourt.com pour plus d'informations."
PLG_CONTENT_SNAP_GALLERY_IMAGEMARGIN_LABEL="Taille des marges d'image"
PLG_CONTENT_SNAP_GALLERY_IMAGEMARGIN_DESC="Taille des marges d'image, en px."
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_LABEL="Titre de l'image"
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_DESC="Affiche le nom de fichier de l'image sur l'image. Notez que l'extension du fichier n'est pas affichée, les underscores sont remplacés par des espaces, et la première lettre est forcée en majuscule."
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_OPT_HIDE="Ne pas afficher les titres d'images"
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_OPT_HOVER="Afficher les titres uniquement au survol du curseur"
PLG_CONTENT_SNAP_GALLERY_IMAGETITLE_OPT_ALWAYS="Afficher les titres en permanence"
PLG_CONTENT_SNAP_GALLERY_USETITLEASALT_LABEL="Utiliser le titre comme attribut 'alt'"
PLG_CONTENT_SNAP_GALLERY_USETITLEASALT_DESC="Utilise le titre de l'image comme attribut 'alt' pour la miniature. Ceci est utile si vos images ont des titres descriptifs, mais si ce sont juste des noms comme 'DSC00023.JPG', c'est moins utile et vous pourriez vouloir désactiver cette option. Vous pouvez personnaliser vos titres d'images si vos noms de fichiers ne sont pas descriptifs. Consultez le guide pour plus de détails. Globalement, cette fonctionnalité est bonne pour le SEO et l'accessibilité, mais uniquement si vos titres d'images sont pertinents."
PLG_CONTENT_SNAP_GALLERY_USELABELSFILE_LABEL="Obtenir les titres depuis un fichier de labels"
PLG_CONTENT_SNAP_GALLERY_USELABELSFILE_DESC="Fonctionnalité avancée - consultez le guide utilisateur sur <a href=\"https://therichcourt.com\" target=\"_blank\">www.TheRichCourt.com</a>"

; Fieldset Shadowbox
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXDESCRIPTION_LABEL="Shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXDESCRIPTION_DESC="Choisissez le type de shadowbox à utiliser. Si vous en avez déjà un que vous appréciez, vous pouvez l'utiliser en sélectionnant 'Utiliser un autre shadowbox'. Cela ajoutera des liens rel='shadowbox[snap_gallery]' aux images, mais n'inclura pas la partie shadowbox de ce plugin, ce qui permettra à votre propre shadowbox de prendre le relais. Cette option est utile pour éviter les conflits avec votre plugin shadowbox existant."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_LABEL="Shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_DESC="Sélectionnez le type de shadowbox à utiliser avec la galerie."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_BUILTIN="Utiliser le shadowbox intégré (Recommandé)"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_LEGACY="Utiliser l'ancien shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_ANOTHER="Utiliser un autre shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXOPTION_OPT_NONE="Pas de shadowbox"
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_LABEL="Empêcher le défilement"
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_DESC="Vous pouvez empêcher le défilement de la page lorsque le shadowbox est ouvert. Cela masque la barre de défilement, ce qui dans certains navigateurs rend le contenu légèrement plus large et semble le décaler de gauche à droite."
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_OPT_ALLOW="Autoriser le défilement"
PLG_CONTENT_SNAP_GALLERY_HIDESCROLLBAR_OPT_PREVENT="Empêcher le défilement (masque la barre de défilement, ce qui peut décaler le contenu)"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXANIMATIONS_LABEL="Animations de transition"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXANIMATIONS_DESC="Choisissez le type d'animation de transition lors du passage entre les images dans le shadowbox (ne s'applique pas à l'ancien shadowbox)"

; Fieldset Apparence - Miniatures de la galerie
PLG_CONTENT_SNAP_GALLERY_THUMBNAILS_NOTE_LABEL="Miniatures de la galerie"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILS_NOTE_DESC="Personnalisez certains éléments pour les adapter à votre site."
PLG_CONTENT_SNAP_GALLERY_THUMBBGCOLOUR_LABEL="Couleur d'arrière-plan des miniatures"
PLG_CONTENT_SNAP_GALLERY_THUMBBGCOLOUR_DESC="La couleur des miniatures d'images pendant le chargement des images."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTCOLOUR_LABEL="Couleur du titre de l'image"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTCOLOUR_DESC="La couleur des titres d'images (notez que les titres d'images doivent être activés dans les paramètres de la galerie pour que cela s'applique)."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTSIZE_LABEL="Taille du texte du titre (px)"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTSIZE_DESC="Définissez la taille du texte du titre sur les miniatures. 14px par défaut."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_LABEL="Épaisseur du texte du titre"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_DESC="Épaisseur du texte du titre à l'intérieur des miniatures."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_OPT_BOLD="Gras"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTWEIGHT_OPT_NORMAL="Normal"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTALIGN_LABEL="Alignement du texte du titre"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTALIGN_DESC="Alignez le texte du titre dans la miniature de l'image. Notez que si le débordement est défini sur masqué et ce paramètre sur centré, le texte semblera aligné à gauche s'il est plus large que la miniature."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_LABEL="Débordement du texte du titre"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_DESC="Que faire si le texte du titre est plus large que la miniature."
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_OPT_HIDDEN="Masqué"
PLG_CONTENT_SNAP_GALLERY_TITLETEXTOVERFLOW_OPT_AUTO="Automatique"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILRADIUS_LABEL="Rayon des coins des miniatures (px)"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILRADIUS_DESC="Arrondissez les coins des miniatures. 3px fonctionne très bien pour un look propre et moderne. Ou utilisez un rayon énorme pour des miniatures en forme de bulles. Entrez 0 pour des coins carrés normaux."
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_LABEL="Filtre des miniatures"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_DESC="Appliquez un filtre aux miniatures de votre galerie. Ce filtre est retiré avec une transition fluide lorsque la souris survole la miniature, révélant les vraies couleurs. Notez que le filtre de miniature ne fonctionnera que sur les navigateurs modernes (pas Internet Explorer). Les utilisateurs d'IE verront les images en couleurs."
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_OPT_NONE="Pas de filtre"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_OPT_SEPIA="Sépia"
PLG_CONTENT_SNAP_GALLERY_THUMBNAILFILTER_OPT_GREYSCALE="Niveaux de gris (Noir et Blanc)"

; Fieldset Apparence - Shadowbox
PLG_CONTENT_SNAP_GALLERY_SHADOWBOX_APPEARANCE_NOTE_LABEL="Shadowbox"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOX_APPEARANCE_NOTE_DESC="Les paramètres ci-dessous ne s'appliquent que si vous utilisez le shadowbox intégré (activé par défaut)."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_LABEL="Titres des images"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_DESC="Afficher ou masquer les titres des images dans le shadowbox. 'Masquage automatique' fait apparaître le titre au mouvement de la souris, puis le fait disparaître en cas d'inactivité."
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_OPT_SHOW="Afficher"
PLG_CONTENT_SNAP_GALLERY_SHADOWBOXTITLE_OPT_HIDE="Masquer"
PLG_CONTENT_SNAP_GALLERY_OVERLAYCOLOUR_LABEL="Couleur de la superposition"
PLG_CONTENT_SNAP_GALLERY_OVERLAYCOLOUR_DESC="La couleur utilisée pour couvrir le reste du site lorsque le shadowbox est ouvert. Notez que cette couleur sera affectée par le réglage d'opacité."
PLG_CONTENT_SNAP_GALLERY_OVERLAYOPACITY_LABEL="Opacité de la superposition"
PLG_CONTENT_SNAP_GALLERY_OVERLAYOPACITY_DESC="L'opacité de la couleur utilisée pour couvrir le reste du site lorsque le shadowbox est ouvert."
PLG_CONTENT_SNAP_GALLERY_OVERLAYBLUR_LABEL="Rayon de flou de la superposition (px)"
PLG_CONTENT_SNAP_GALLERY_OVERLAYBLUR_DESC="Le rayon de flou backdrop-filter en pixels. Notez que cette fonctionnalité n'est pas prise en charge par tous les navigateurs, vous pourriez donc ne pas voir de flou du tout dans certains navigateurs."

; Fieldset À propos
PLG_CONTENT_SNAP_GALLERY_ABOUT_LABEL="Snap Gallery"
PLG_CONTENT_SNAP_GALLERY_ABOUT_DESC="Un plugin de galerie d'images responsive pour Joomla 5/6. Affiche de belles galeries bord à bord dans vos articles via de simples balises {gallery}."
PLG_CONTENT_SNAP_GALLERY_DOCUMENTATION_LABEL="Documentation"
PLG_CONTENT_SNAP_GALLERY_DOCUMENTATION_DESC="Documentation complète et code source disponibles sur <a href=\"https://github.com/dious38/rc-gallery\" target=\"_blank\">https://github.com/dious38/rc-gallery</a>"
PLG_CONTENT_SNAP_GALLERY_SUPPORT_LABEL="Support"
PLG_CONTENT_SNAP_GALLERY_SUPPORT_DESC="Pour signaler un bug ou demander une fonctionnalité, rendez-vous sur <a href=\"https://github.com/dious38/rc-gallery/issues\" target=\"_blank\">https://github.com/dious38/rc-gallery/issues</a>"
PLG_CONTENT_SNAP_GALLERY_CREDITS_LABEL="Crédits"
PLG_CONTENT_SNAP_GALLERY_CREDITS_DESC="Snap Gallery est basé sur RC Gallery, créé à l'origine par Rich Court (<a href=\"https://github.com/TheRichCourt/rc-gallery\" target=\"_blank\">https://github.com/TheRichCourt/rc-gallery</a>). Licence GPL-2.0."

; Fieldset Avancé
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE_LABEL="Fonctionnalité avancée"
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE_DESC="Si vous utilisez de grandes galeries, la production de toutes les miniatures peut prendre beaucoup de temps. Cela ne se produit que lors de la première visite d'une page, mais ce n'est toujours pas idéal. En fait, si vous avez suffisamment d'images, la requête HTTP expirera pendant que votre serveur crée encore les miniatures. Le résultat est que le visiteur verra une erreur. Vous pouvez contourner cela de deux manières différentes."
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE1_LABEL="1"
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE1_DESC="1. Rechargez la page plusieurs fois - à chaque rechargement, le processus avance un peu plus, et après quelques essais la page fonctionnera toujours correctement."
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE2_LABEL="2"
PLG_CONTENT_SNAP_GALLERY_ADVANCED_NOTE2_DESC="2. Activez ce paramètre. Cependant, il y a aussi un problème potentiel. Ce paramètre enverra une requête AJAX pour chaque image, afin de produire les miniatures de manière asynchrone. Cependant, certains serveurs considéreront ce grand nombre de requêtes similaires comme une attaque possible et les bloqueront. Activez donc cette option à vos risques et périls ! Si cela fonctionne sur votre serveur, c'est définitivement la meilleure option."
PLG_CONTENT_SNAP_GALLERY_AJAXIMAGES_LABEL="Activer les images AJAX"
PLG_CONTENT_SNAP_GALLERY_AJAXIMAGES_DESC="Voir la note ci-dessus"

